# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: drcv
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: drcv-db, property: connectionString }
      - key: DRCV_SECRET_KEY
        generateValue: true
      - key: DRCV_HOST
        value: 0.0.0.0
      - key: DRCV_NO_BROWSER
        value: "1"
databases:
  - name: drcv-db
    plan: free
